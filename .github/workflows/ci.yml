name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FOUNDRY_PROFILE: ci

jobs:
  agents:
    name: agents (typecheck + unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agents
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: agents/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

  forge:
    name: forge (${{ matrix.network }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # `ethereum` covers Base Sepolia (standard EVM); `monad` runs Monad's gas model and limits.
        network: [ethereum, monad]
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.5

      - name: Versions
        run: forge --version

      - name: Format
        run: forge fmt --check

      - name: Lint
        run: forge lint --deny warnings

      - name: Build
        run: forge build --sizes

      - name: Test
        run: forge test -vvv --network ${{ matrix.network }}
